<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Kehadiran Koko SMK Inderapura</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background: white; padding: 0; }
            .max-w-6xl { box-shadow: none; border: none; width: 100%; max-width: 100%; }
        }
        .tab-content { display: none; }
        .active-tab { display: block; }
        input[type="checkbox"] { transform: scale(1.2); cursor: pointer; }
    </style>
</head>
<body class="bg-gray-100 font-sans">

<div class="max-w-6xl mx-auto p-4 bg-white shadow-lg min-h-screen border-t-8 border-blue-800">
    <header class="text-center border-b pb-4 mb-4">
        <h1 class="text-3xl font-bold text-blue-900 uppercase">SMK INDERAPURA</h1>
        <h2 class="text-xl font-semibold text-gray-700">Sistem Kehadiran Aktiviti Kokurikulum</h2>
        <input type="text" id="unitName" oninput="saveData()" placeholder="[ Klik & Taip Nama Unit Di Sini ]" 
               class="mt-4 text-center text-2xl font-bold text-blue-600 border-b-2 border-blue-200 focus:border-blue-500 outline-none w-full max-w-xl bg-blue-50 p-2 rounded">
    </header>

    <nav class="flex flex-wrap gap-2 mb-6 no-print justify-center border-b pb-4">
        <button onclick="openTab('tab1')" class="tab-btn px-4 py-2 bg-slate-700 text-white rounded hover:bg-slate-800 transition">1. Senarai Murid</button>
        <button onclick="openTab('tab2')" class="tab-btn px-4 py-2 bg-slate-700 text-white rounded hover:bg-slate-800 transition">2. Pengisian Kehadiran</button>
        <button onclick="openTab('tab3')" class="tab-btn px-4 py-2 bg-slate-700 text-white rounded hover:bg-slate-800 transition">3. Analisa Donut</button>
        <button onclick="openTab('tab4')" class="tab-btn px-4 py-2 bg-slate-700 text-white rounded hover:bg-slate-800 transition">4. Laporan Aktiviti</button>
        <button onclick="openTab('tab5')" class="tab-btn px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700 transition">5. JANA LAPORAN PDF</button>
    </nav>

    <div id="tab1" class="tab-content active-tab animate-fade-in">
        <div class="bg-yellow-50 p-4 border-l-4 border-yellow-400 mb-4">
            <p class="text-sm"><b>Nota:</b> Masukkan nama murid satu per satu (setiap baris satu nama). Selepas selesai, klik butang <b>"Proses Senarai"</b>.</p>
        </div>
        <textarea id="studentInput" class="w-full h-64 border-2 p-4 rounded-lg focus:ring-2 focus:ring-blue-400 outline-none" placeholder="Contoh:&#10;MUHAMMAD AMIRUL&#10;SITI NURHALIZA&#10;CHONG WEI FENG"></textarea>
        <div class="mt-4 flex gap-2">
            <button onclick="processStudents()" class="bg-blue-700 text-white px-8 py-3 rounded-lg font-bold shadow-md hover:bg-blue-800">PROSES SENARAI</button>
            <button onclick="clearData()" class="bg-red-500 text-white px-4 py-3 rounded-lg font-semibold hover:bg-red-600">Padam Semua Data</button>
        </div>
    </div>

    <div id="tab2" class="tab-content overflow-x-auto">
        <table class="w-full border-collapse border border-gray-300 text-sm">
            <thead>
                <tr class="bg-blue-900 text-white">
                    <th class="border p-2">BIL</th>
                    <th class="border p-2 min-w-[200px]">NAMA MURID</th>
                    <script>
                        for(let i=1; i<=12; i++) {
                            document.write(`<th class="border p-1 w-12 text-center">P${i}<br>
                                <input type="text" id="date${i}" oninput="saveData()" placeholder="DD/MM" class="w-full text-[10px] text-black text-center mt-1 py-1">
                            </th>`);
                        }
                    </script>
                    <th class="border p-2 bg-blue-700">JUMLAH</th>
                </tr>
            </thead>
            <tbody id="attendanceBody"></tbody>
        </table>
    </div>

    <div id="tab3" class="tab-content text-center py-10">
        <h2 class="text-2xl font-bold mb-6">Analisa Kehadiran Keseluruhan</h2>
        <div class="flex flex-col items-center justify-center space-y-6">
            <div style="width: 300px; height: 300px;">
                <canvas id="donutChart"></canvas>
            </div>
            <div id="statsBox" class="grid grid-cols-2 md:grid-cols-4 gap-4 w-full"></div>
        </div>
    </div>

    <div id="tab4" class="tab-content">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 p-4">
            <div class="space-y-4">
                <div>
                    <label class="font-bold">Tarikh Perjumpaan:</label>
                    <input type="date" id="reportDate" oninput="saveData()" class="w-full border p-2 rounded">
                </div>
                <div>
                    <label class="font-bold">Tempat Aktiviti:</label>
                    <input type="text" id="reportLocation" oninput="saveData()" class="w-full border p-2 rounded" placeholder="Contoh: Dewan Al-Khawarizmi">
                </div>
                <div>
                    <label class="font-bold">Ringkasan Aktiviti:</label>
                    <textarea id="reportDesc" oninput="saveData()" class="w-full border p-2 rounded h-32" placeholder="Nyatakan aktiviti yang dilakukan..."></textarea>
                </div>
            </div>
            <div class="border-2 border-dashed border-gray-300 p-4 rounded text-center">
                <label class="font-bold block mb-2">Gambar Aktiviti:</label>
                <input type="file" accept="image/*" id="imgUpload" onchange="handleImage(event)" class="mb-4 w-full">
                <img id="imgPreview" src="" class="hidden mx-auto max-h-64 rounded shadow">
            </div>
        </div>
    </div>

    <div id="tab5" class="tab-content">
        <div id="finalReport" class="border-4 border-double border-gray-400 p-8 m-2 bg-white text-black min-h-[1000px]">
            <div class="text-center mb-6">
                <h1 class="text-2xl font-bold">LAPORAN AKTIVITI KOKURIKULUM</h1>
                <h2 id="pUnit" class="text-xl font-bold text-blue-800 mt-2"></h2>
                <hr class="mt-4 border-black">
            </div>

            <table class="w-full mb-6 text-left border-collapse">
                <tr>
